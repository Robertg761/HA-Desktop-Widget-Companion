name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          cache: pip
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
